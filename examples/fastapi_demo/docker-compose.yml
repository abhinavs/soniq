x-app: &app
  build:
    context: ../..
    dockerfile: examples/fastapi_demo/Dockerfile
  environment:
    SONIQ_DATABASE_URL: postgresql://postgres:postgres@db:5432/soniq_demo
    DASHBOARD_URL: http://localhost:6161

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soniq_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soniq_demo"]
      interval: 2s
      retries: 30

  setup:
    <<: *app
    command: soniq setup main:soniq
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully

  dashboard:
    <<: *app
    command: soniq dashboard --app main:soniq --host 0.0.0.0 --port 6161
    ports:
      - "6161:6161"
    depends_on:
      setup:
        condition: service_completed_successfully
