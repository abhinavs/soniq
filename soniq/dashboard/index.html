<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soniq</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' fill='none' stroke='%232f6690' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'><line x1='24' y1='216' x2='168' y2='216'/><path d='M88,116.51,58.65,88a8,8,0,0,1,2.2-13.3L68,72l57.53,21.17,54.84-32.75a32,32,0,0,1,41,7.32L240,91.64l-147.41,88a32,32,0,0,1-38-4.32L18.53,140a8,8,0,0,1,2.32-13.19L24,125.27,55.79,136Z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --sunken: #eef2f6;
  --ink: #132034;
  --ink-2: #4e5d73;
  --muted: #7a879a;
  --line: #e2e7ee;
  --line-strong: #cfd7e2;
  --accent: #2f6690;
  --accent-soft: #e4eef6;
  --done: #0e9aa7;
  --failed: #d64555;
  --queued: #5b6fd6;
  --running: #c98a12;
  --cancelled: #8c97a8;
  --done-soft: #e0f3f4;
  --failed-soft: #fbe7e9;
  --queued-soft: #e8ebfa;
  --running-soft: #faf0dc;
  --cancelled-soft: #eef0f3;
  --shadow: 0 1px 2px rgba(19, 32, 52, 0.05), 0 8px 24px -12px rgba(19, 32, 52, 0.12);
  --drawer-shadow: -24px 0 48px -24px rgba(19, 32, 52, 0.25);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #121b2b;
  --surface-2: #162133;
  --sunken: #0f1726;
  --ink: #e7ecf3;
  --ink-2: #a7b3c4;
  --muted: #74829a;
  --line: #22304a;
  --line-strong: #2e3f5e;
  --accent: #6fa8dc;
  --accent-soft: #1a2b44;
  --done: #1fa7b4;
  --failed: #e5596a;
  --queued: #8c9bf2;
  --running: #e6ae3e;
  --cancelled: #7d889b;
  --done-soft: #12303a;
  --failed-soft: #3a1c26;
  --queued-soft: #1f2645;
  --running-soft: #33291a;
  --cancelled-soft: #1c2536;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  --drawer-shadow: -24px 0 48px -24px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  font-feature-settings: "tnum" 1, "cv11" 1;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.nav a {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav .count { font-size: 12px; color: var(--muted); }
.nav .count.alert { color: var(--failed); font-weight: 600; }
.nav-label { padding: 18px 10px 6px; font-size: 12px; color: var(--muted); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 6px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--sunken); }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.main { min-width: 0; padding: 22px 32px 64px; }
.top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
.top .spacer { flex: 1; }
.health { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--done); }
.dot.warn { background: var(--running); }
.dot.bad { background: var(--failed); }
.live { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.live .dot.on { background: var(--done); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.search { position: relative; }
.search input {
  width: 260px; padding: 7px 12px 7px 32px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface);
}
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; background: var(--running-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--running) 35%, transparent); }
.banner.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.banner code { font-family: var(--mono); font-size: 12.5px; }

/* The flow strip: where every job is right now */
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
.flow-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.flow-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.flow-figs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.fig { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; border-radius: 8px; }
.fig .n { font-size: 36px; line-height: 1.1; font-weight: 600; letter-spacing: -0.035em; }
.fig .l { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-weight: 500; }
.fig .l i { width: 9px; height: 9px; border-radius: 3px; }
a.fig:hover .n { color: var(--accent); }
.fig.failed.has .n { color: var(--failed); }
.bar { display: flex; gap: 2px; height: 10px; border-radius: 6px; overflow: hidden; background: var(--sunken); }
.bar span { display: block; height: 100%; min-width: 0; transition: flex-grow 600ms cubic-bezier(.2,.7,.2,1); }

/* Panels */
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 20px; margin-bottom: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.panel-body { padding: 14px 20px 18px; }

.kpis { display: flex; gap: 28px; flex-wrap: wrap; padding: 4px 20px 0; }
.kpi .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.kpi .k { color: var(--muted); font-size: 12.5px; }

.chart { position: relative; padding: 8px 20px 16px; }
.chart svg { display: block; width: 100%; height: 200px; overflow: visible; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis-text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + g rect, .chart g.col.hover rect { opacity: 1; }
.legend { display: flex; gap: 16px; color: var(--ink-2); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 150px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
  padding: 9px 11px; box-shadow: var(--shadow); font-size: 12.5px; opacity: 0; transition: opacity 120ms;
}
.tip.show { opacity: 1; }
.tip b { display: block; margin-bottom: 4px; font-weight: 600; }
.tip div { display: flex; justify-content: space-between; gap: 14px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.facts { display: flex; flex-direction: column; }
.facts > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.facts > div:last-child { border-bottom: 0; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-weight: 600; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 10px 20px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }
td .name { font-weight: 500; }
td .err { display: block; max-width: 420px; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-family: var(--mono); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 500; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-queued { background: var(--queued-soft); color: var(--queued); }
.s-processing { background: var(--running-soft); color: var(--running); }
.s-done { background: var(--done-soft); color: var(--done); }
.s-cancelled { background: var(--cancelled-soft); color: var(--cancelled); }
.s-dead_letter, .s-failed { background: var(--failed-soft); color: var(--failed); }
.mini { display: flex; gap: 2px; height: 6px; width: 120px; border-radius: 4px; overflow: hidden; background: var(--sunken); }
.mini span { height: 100%; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.filters input { min-width: 220px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--sunken); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0b1220; }
.btn.danger { color: var(--failed); }
.btn.danger.armed { background: var(--failed); border-color: var(--failed); color: #fff; }
.btn.sm { padding: 3px 10px; font-size: 12.5px; }

.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--sunken), var(--surface-2), var(--sunken)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(11, 18, 32, 0.32); opacity: 0; pointer-events: none; transition: opacity 180ms; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 21;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--drawer-shadow);
  transform: translateX(100%); transition: transform 220ms cubic-bezier(.2,.7,.2,1), visibility 0s 220ms;
  display: flex; flex-direction: column; visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; transition-delay: 0s; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; word-break: break-all; }
.drawer-body { overflow-y: auto; padding: 18px 22px 28px; flex: 1; }
.drawer-actions { display: flex; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); }
.drawer-actions:empty { display: none; }
.close { border: 0; background: none; cursor: pointer; padding: 4px; color: var(--muted); border-radius: 6px; }
.close:hover { color: var(--ink); background: var(--sunken); }
.props { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; margin: 0 0 22px; }
.props dt { color: var(--muted); }
.props dd { margin: 0; min-width: 0; word-break: break-word; }
.drawer h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
pre.code {
  margin: 0 0 20px; padding: 12px 14px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line);
  font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
}
pre.code.error { background: var(--failed-soft); border-color: color-mix(in srgb, var(--failed) 25%, transparent); }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 500; opacity: 0; transition: opacity 160ms, transform 160ms; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.keygate { max-width: 420px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow); }
.keygate h2 { margin: 0 0 6px; font-size: 18px; }
.keygate p { color: var(--ink-2); margin: 0 0 18px; }
.keygate form { display: flex; gap: 8px; }
.keygate input { flex: 1; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); font-family: var(--mono); }

.plugin-panel { padding: 18px 20px; }

@media (max-width: 1100px) {
  .grid2 { grid-template-columns: 1fr; }
  .flow-figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 8px 0 0; }
  .nav { display: flex; gap: 2px; }
  .nav a { white-space: nowrap; gap: 6px; }
  .nav-label, .side-foot .seg-wrap-label { display: none; }
  .side-foot { margin: 0 0 0 auto; flex-direction: row; padding: 0; }
  .main { padding: 18px 16px 48px; }
  .top { flex-wrap: wrap; }
  .search input { width: 100%; }
  .search { order: 10; flex-basis: 100%; }
  .flow-figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fig .n { font-size: 28px; }
  th, td { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="24" y1="216" x2="168" y2="216"/><path d="M88,116.51,58.65,88a8,8,0,0,1,2.2-13.3L68,72l57.53,21.17,54.84-32.75a32,32,0,0,1,41,7.32L240,91.64l-147.41,88a32,32,0,0,1-38-4.32L18.53,140a8,8,0,0,1,2.32-13.19L24,125.27,55.79,136Z"/></svg>
      Soniq
    </div>
    <nav class="nav" id="nav" aria-label="Views">
      <a href="#/overview" data-view="overview">Overview</a>
      <a href="#/jobs" data-view="jobs">Jobs <span class="count" id="nav-jobs"></span></a>
      <a href="#/failed" data-view="failed">Failed <span class="count" id="nav-failed"></span></a>
      <a href="#/queues" data-view="queues">Queues</a>
      <a href="#/types" data-view="types">Job types</a>
      <a href="#/workers" data-view="workers">Workers <span class="count" id="nav-workers"></span></a>
      <div id="nav-panels"></div>
    </nav>
    <div class="side-foot">
      <div class="seg" id="theme" role="group" aria-label="Theme">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
        <button type="button" data-theme="system">Auto</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="top">
      <h1 id="title">Overview</h1>
      <span class="health" id="health" title="System health"><span class="dot"></span><span>Checking</span></span>
      <span class="spacer"></span>
      <label class="search">
        <span class="sr-only">Search jobs</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="global-search" type="search" placeholder="Search by job name or error" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <button class="live" id="live" type="button" aria-pressed="true" title="Pause or resume live updates">
        <span class="dot on"></span><span id="live-text">Live</span>
      </button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="drawer-head">
    <div><h2 id="drawer-title"></h2><div id="drawer-sub"></div></div>
    <button class="close" id="drawer-close" type="button" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-actions" id="drawer-actions"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CAN_WRITE = __SONIQ_CAN_WRITE__;
const REFRESH_MS = 10000;
// Works at "/" and when mounted under a prefix such as "/admin/queue".
const BASE = location.pathname.replace(/\/+$/, '');
const KEY_STORE = 'soniq_dashboard_key';
const THEME_STORE = 'soniq_theme';

const $ = (sel, root = document) => root.querySelector(sel);
const state = { live: true, timer: null, view: 'overview', jobs: { offset: 0, status: '', queue: '', q: '' }, failedOffset: 0, panels: [] };

function store(kind, key, value) {
  try {
    const s = kind === 'session' ? sessionStorage : localStorage;
    if (value === undefined) return s.getItem(key);
    if (value === null) s.removeItem(key); else s.setItem(key, value);
  } catch (e) { return null; }
}

// ---- API ---------------------------------------------------------------

(function takeKeyFromUrl() {
  const params = new URLSearchParams(location.search);
  if (params.get('api_key')) store('session', KEY_STORE, params.get('api_key'));
})();

class AuthError extends Error {}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const key = store('session', KEY_STORE);
  if (key) headers['X-API-Key'] = key;
  const res = await fetch(BASE + path, Object.assign({}, opts, { headers }));
  if (res.status === 401) throw new AuthError('API key required');
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.detail) || `Request failed (${res.status})`);
  return body;
}

// ---- Formatting --------------------------------------------------------

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat();
const cf = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
const num = (n) => nf.format(Number(n) || 0);
const big = (n) => (Number(n) || 0) >= 10000 ? cf.format(n) : num(n);

function duration(ms) {
  if (ms == null || isNaN(ms)) return '-';
  ms = Number(ms);
  if (ms < 1000) return `${Math.round(ms)} ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1)} s`;
  if (ms < 3600000) return `${(ms / 60000).toFixed(1)} min`;
  return `${(ms / 3600000).toFixed(1)} h`;
}

function ago(iso) {
  if (!iso) return '-';
  const t = new Date(iso).getTime();
  const s = Math.round((Date.now() - t) / 1000);
  const abs = Math.abs(s);
  const fmt = (v, u) => s >= 0 ? `${v}${u} ago` : `in ${v}${u}`;
  if (abs < 45) return s >= 0 ? 'just now' : 'in a moment';
  if (abs < 3600) return fmt(Math.round(abs / 60), 'm');
  if (abs < 86400) return fmt(Math.round(abs / 3600), 'h');
  return fmt(Math.round(abs / 86400), 'd');
}
const when = (iso) => iso ? `<span title="${esc(new Date(iso).toLocaleString())}">${esc(ago(iso))}</span>` : '<span class="muted">-</span>';
const fullTime = (iso) => iso ? esc(new Date(iso).toLocaleString()) : '<span class="muted">-</span>';

const STATUS_LABEL = { queued: 'Queued', processing: 'Running', done: 'Done', cancelled: 'Cancelled', dead_letter: 'Failed', failed: 'Failed' };
const badge = (s) => `<span class="badge s-${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;
const json = (v) => esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2));
const empty = (title, text) => `<div class="empty"><strong>${esc(title)}</strong>${text}</div>`;
const skeleton = (rows = 4) => `<div class="panel-body">${Array.from({ length: rows }, () => '<div class="skeleton" style="margin:14px 0"></div>').join('')}</div>`;

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---- Theme -------------------------------------------------------------

const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const choice = store('local', THEME_STORE) || 'system';
  const resolved = choice === 'system' ? (darkQuery.matches ? 'dark' : 'light') : choice;
  document.documentElement.setAttribute('data-theme', resolved);
  document.querySelectorAll('#theme button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === choice)));
}
$('#theme').addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  store('local', THEME_STORE, t.dataset.theme === 'system' ? null : t.dataset.theme);
  applyTheme();
  if (state.view === 'overview') render();
});
darkQuery.addEventListener('change', applyTheme);
applyTheme();

// ---- Shared chrome -----------------------------------------------------

async function refreshChrome() {
  const [stats, health, workers, drift] = await Promise.allSettled([
    api('/api/stats'), api('/api/system/health'), api('/api/workers'), api('/api/tasks/drift'),
  ]);
  if (stats.status === 'fulfilled') {
    const s = stats.value;
    $('#nav-jobs').textContent = big(s.total);
    const f = $('#nav-failed');
    f.textContent = s.dead_letter ? big(s.dead_letter) : '';
    f.classList.toggle('alert', s.dead_letter > 0);
  }
  if (workers.status === 'fulfilled') {
    $('#nav-workers').textContent = String(workers.value.filter(isAlive).length);
  }
  const h = $('#health');
  if (health.status === 'fulfilled') {
    const v = health.value;
    const cls = v.status === 'healthy' ? 'ok' : v.status === 'degraded' ? 'warn' : 'bad';
    const label = v.status === 'healthy' ? 'Healthy' : v.status === 'degraded' ? 'Degraded' : 'Unhealthy';
    h.innerHTML = `<span class="dot ${cls}"></span><span>${label}</span>`;
    h.title = `Backlog ${num(v.queue_backlog)}, ${v.error_rate_last_hour}% failed in the last hour`;
  } else if (health.reason instanceof AuthError) {
    throw health.reason;
  } else {
    h.innerHTML = '<span class="dot bad"></span><span>No database</span>';
    h.title = 'The dashboard cannot reach the database';
  }
  return {
    stats: stats.value, health: health.value,
    workers: workers.status === 'fulfilled' ? workers.value : [],
    drift: drift.status === 'fulfilled' ? drift.value : null,
  };
}

const isAlive = (w) => w.status === 'active' && w.last_heartbeat && (Date.now() - new Date(w.last_heartbeat).getTime()) < 120000;

async function loadPanels() {
  try { state.panels = await api('/api/panels'); } catch (e) { state.panels = []; }
  $('#nav-panels').innerHTML = state.panels.length
    ? '<div class="nav-label">Plugins</div>' + state.panels.map((p) => `<a href="#/panel/${encodeURIComponent(p.id)}" data-view="panel:${esc(p.id)}">${esc(p.title)}</a>`).join('')
    : '';
}

// ---- Views -------------------------------------------------------------

const VIEWS = {
  overview: { title: 'Overview', render: renderOverview },
  jobs: { title: 'Jobs', render: renderJobs },
  failed: { title: 'Failed jobs', render: renderFailed },
  queues: { title: 'Queues', render: renderQueues },
  types: { title: 'Job types', render: renderTypes },
  workers: { title: 'Workers', render: renderWorkers },
};

function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [name, ...rest] = hash.split('/');
  if (name === 'panel' && rest.length) return { view: 'panel:' + decodeURIComponent(rest.join('/')) };
  return { view: VIEWS[name] ? name : 'overview' };
}

async function render(opts = {}) {
  const { view } = route();
  const changed = view !== state.view || opts.first;
  state.view = view;
  document.querySelectorAll('#nav a').forEach((a) => {
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const el = $('#view');
  try {
    const chrome = await refreshChrome();
    if (view.startsWith('panel:')) {
      const id = view.slice(6);
      const panel = state.panels.find((p) => p.id === id);
      $('#title').textContent = panel ? panel.title : 'Plugin panel';
      if (changed) el.innerHTML = `<section class="panel">${skeleton(3)}</section>`;
      await renderPanel(el, id);
    } else {
      $('#title').textContent = VIEWS[view].title;
      if (changed) el.innerHTML = `<section class="panel">${skeleton(5)}</section>`;
      await VIEWS[view].render(el, chrome);
    }
    document.title = `${$('#title').textContent} - Soniq`;
  } catch (e) {
    if (e instanceof AuthError) return showKeyGate();
    el.innerHTML = `<section class="panel">${empty('Could not load this view', `<p>${esc(e.message)}. Check that the dashboard can reach PostgreSQL, then refresh.</p>`)}</section>`;
  }
}

function noticeHtml(chrome) {
  let html = '';
  const skew = chrome.drift && chrome.drift.skewed_names || [];
  if (skew.length) {
    const names = skew.slice(0, 3).map((s) => `<code>${esc(s.job_name)}</code>`).join(', ');
    html += `<div class="banner" role="alert"><span class="dot warn" style="margin-top:6px"></span><div><strong>${skew.length} job name${skew.length > 1 ? 's have' : ' has'} no worker.</strong> ${names}${skew.length > 3 ? ' and more' : ''} were enqueued in the last hour, but no running worker registers ${skew.length > 1 ? 'them' : 'it'}. Deploy the code that defines ${skew.length > 1 ? 'these jobs' : 'this job'}, or check the job name.</div></div>`;
  }
  return html;
}

    <div class="grid2">

        <div class="panel-head">
          <h2 id="tp-title">Last 24 hours</h2>
          <div class="legend"><span><i style="background:var(--done)"></i>Completed</span><span><i style="background:var(--failed)"></i>Failed</span></div>

function drawChart(host, rows) {
  // 24 hourly slots ending at the current hour, filled from the API rows.
  const hour = 3600000;
  const end = Math.floor(Date.now() / hour) * hour;
  const byHour = new Map(rows.map((r) => [Math.floor(new Date(r.hour).getTime() / hour) * hour, r]));
  const data = Array.from({ length: 24 }, (_, i) => {
    const t = end - (23 - i) * hour;
    const r = byHour.get(t) || {};
    return { t, done: Number(r.completed) || 0, failed: Number(r.dead_letter) || 0 };
  });
  const max = Math.max(1, ...data.map((d) => d.done + d.failed));
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const top = Math.ceil(max / step) * step;
  const W = 640, H = 200, L = 34, B = 22, T = 6;
  const cw = (W - L) / 24, bw = Math.max(4, cw - 6);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const ticks = [0, top / 2, top];
  // Show minutes only where the local zone is off the hour, like India's +05:30.
  const label = (t) => new Date(t).toLocaleTimeString([], new Date(t).getMinutes() ? { hour: 'numeric', minute: '2-digit' } : { hour: 'numeric' });

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Completed and failed jobs per hour for the last 24 hours">`;
  ticks.forEach((v) => {
    svg += `<line class="grid-line" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-text" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${cf.format(v)}</text>`;
  });
  data.forEach((d, i) => {
    const x = L + i * cw + (cw - bw) / 2;
    const yd = y(d.done), yf = y(d.done + d.failed);
    const gap = d.done && d.failed ? 2 : 0;
    svg += `<g class="col" data-i="${i}">`;
    if (d.done) svg += `<path d="${barPath(x, yd, bw, y(0) - yd, !d.failed)}" fill="var(--done)"/>`;
    if (d.failed) svg += `<path d="${barPath(x, yf, bw, Math.max(1, yd - yf - gap), true)}" fill="var(--failed)"/>`;
    svg += `<rect class="hit" x="${L + i * cw}" y="${T}" width="${cw}" height="${H - T - B}"/></g>`;
    if (i % 6 === 0 || i === 23) svg += `<text class="axis-text" x="${L + i * cw + cw / 2}" y="${H - 5}" text-anchor="middle">${i === 23 ? 'Now' : esc(label(d.t))}</text>`;
  });
  svg += '</svg>';
  const table = `<table class="sr-only"><caption>Jobs per hour</caption><tr><th>Hour</th><th>Completed</th><th>Failed</th></tr>${data.map((d) => `<tr><td>${esc(label(d.t))}</td><td>${d.done}</td><td>${d.failed}</td></tr>`).join('')}</table>`;
  host.innerHTML = svg + table + '<div class="tip" id="tip"></div>';

  const tip = $('#tip', host);
  host.querySelectorAll('.col').forEach((g) => {
    g.addEventListener('mouseenter', () => {
      const d = data[g.dataset.i];
      const from = new Date(d.t), to = new Date(d.t + hour);
      tip.innerHTML = `<b>${esc(from.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))} to ${esc(to.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))}</b>
        <div><span><i style="background:var(--done)"></i>Completed</span><span>${num(d.done)}</span></div>
        <div><span><i style="background:var(--failed)"></i>Failed</span><span>${num(d.failed)}</span></div>`;
      const box = host.getBoundingClientRect(), r = g.getBoundingClientRect();
      const left = Math.min(Math.max(r.left - box.left + r.width / 2 - 80, 8), box.width - 168);
      tip.style.left = `${left}px`;
      tip.style.top = '0px';
      tip.classList.add('show');
      host.querySelectorAll('.col path').forEach((p) => { p.style.opacity = p.parentNode === g ? '1' : '0.45'; });
    });
    g.addEventListener('mouseleave', () => {
      tip.classList.remove('show');
      host.querySelectorAll('.col path').forEach((p) => { p.style.opacity = ''; });
    });
  });
}

// Bar with a 4px rounded top, square at the baseline.
function barPath(x, y, w, h, roundTop) {
  if (h <= 0) return '';
  const r = roundTop ? Math.min(4, w / 2, h) : 0;
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function jobTable(jobs, compact) {
  if (!jobs.length) return empty('No jobs yet', compact ? '<p>Enqueue a job and it shows up here within a few seconds.</p>' : '<p>Nothing matches these filters. Clear them to see every job.</p>');
  return `<div class="table-wrap"><table>
    <thead><tr><th>Job</th><th>Status</th><th>Queue</th><th class="num">Attempts</th><th>Created</th>${compact ? '' : '<th>Last error</th>'}</tr></thead>
    <tbody>${jobs.map((j, i) => `
      <tr class="click" tabindex="0" data-row="${i}">
        <td><span class="name">${esc(j.job_name)}</span></td>
        <td>${badge(j.status)}</td>
        <td>${esc(j.queue)}</td>
        <td class="num">${num(j.attempts)} of ${num(j.max_attempts)}</td>
        <td>${when(j.created_at)}</td>
        ${compact ? '' : `<td><span class="err">${esc(j.last_error ? j.last_error.split('\n').filter(Boolean).pop() : '')}</span></td>`}
      </tr>`).join('')}
    </tbody></table></div>`;
}

function wireRows(root, rows, open = (r) => openJob(r.id)) {
  root.querySelectorAll('tr[data-row]').forEach((tr) => {
    const go = () => open(rows[tr.dataset.row]);
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

function hashParams() {
  const q = location.hash.split('?')[1] || '';
  return new URLSearchParams(q);
}

async function renderJobs(el) {
  const p = hashParams();
  const f = state.jobs;
  if (p.has('status')) { f.status = p.get('status'); f.offset = 0; history.replaceState(null, '', '#/jobs'); }
  if (p.has('q')) { f.q = p.get('q'); f.offset = 0; history.replaceState(null, '', '#/jobs'); }
  const limit = 25;
  const qs = new URLSearchParams({ limit, offset: f.offset });
  if (f.status) qs.set('status', f.status);
  if (f.queue) qs.set('queue', f.queue);
  if (f.q) qs.set('query', f.q);
  const [res, queues] = await Promise.all([api('/api/jobs/search?' + qs), api('/api/queues')]);
  const focused = document.activeElement && document.activeElement.id;
  el.innerHTML = `
    <section class="panel">
      <div class="panel-head">
        <form class="filters" id="job-filters" onsubmit="return false">
          <input id="f-q" type="search" placeholder="Filter by name or error" value="${esc(f.q)}" aria-label="Filter by name or error">
          <select id="f-status" aria-label="Status">
            <option value="">Any status</option>
            ${['queued', 'processing', 'done', 'cancelled'].map((s) => `<option value="${s}"${f.status === s ? ' selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
          </select>
          <select id="f-queue" aria-label="Queue">
            <option value="">Any queue</option>
            ${queues.map((q) => `<option value="${esc(q.queue)}"${f.queue === q.queue ? ' selected' : ''}>${esc(q.queue)}</option>`).join('')}
          </select>
        </form>
        <span class="muted">Failed jobs are under <a href="#/failed">Failed</a></span>
      </div>
      <div style="margin-top:12px">${jobTable(res.jobs, false)}</div>
      ${res.total_count > limit ? `<div class="pager">
        <span>${num(f.offset + 1)} to ${num(Math.min(f.offset + limit, res.total_count))} of ${num(res.total_count)}</span>
        <span style="display:flex;gap:8px">
          <button class="btn sm" id="prev" ${f.offset === 0 ? 'disabled' : ''}>Previous</button>
          <button class="btn sm" id="next" ${res.has_more ? '' : 'disabled'}>Next</button>
        </span></div>` : ''}
    </section>`;
  wireRows(el, res.jobs);
  if (focused === 'f-q') { const i = $('#f-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  let debounce;
  $('#f-q').addEventListener('input', (e) => { clearTimeout(debounce); debounce = setTimeout(() => { f.q = e.target.value.trim(); f.offset = 0; render(); }, 250); });
  $('#f-status').addEventListener('change', (e) => { f.status = e.target.value; f.offset = 0; render(); });
  $('#f-queue').addEventListener('change', (e) => { f.queue = e.target.value; f.offset = 0; render(); });
  if ($('#prev')) $('#prev').addEventListener('click', () => { f.offset = Math.max(0, f.offset - limit); render(); });
  if ($('#next')) $('#next').addEventListener('click', () => { f.offset += limit; render(); });
}

const REASONS = { max_retries_exceeded: 'Out of retries', permanent_failure: 'Permanent failure', job_not_found: 'Unknown job name', invalid_arguments: 'Invalid arguments' };

    <section class="panel">
      <div class="panel-head"><h2>${num(res.total_count)} job${res.total_count === 1 ? '' : 's'} ran out of retries</h2>

      <div class="table-wrap" style="margin-top:12px"><table>

        <tbody>${res.jobs.map((j, i) => `
          <tr class="click" tabindex="0" data-row="${i}">
            <td><span class="name">${esc(j.job_name)}</span><div class="muted" style="font-size:12.5px">${esc(j.queue)}</div></td>
            <td>${esc(REASONS[j.dead_letter_reason] || j.dead_letter_reason)}${j.resurrection_count ? `<div class="muted" style="font-size:12.5px">Replayed ${j.resurrection_count === 1 ? 'once' : num(j.resurrection_count) + ' times'}</div>` : ''}</td>
            <td><span class="err">${esc(j.last_error ? j.last_error.split('\n').filter(Boolean).pop() : '')}</span></td>
            <td class="num">${num(j.attempts)}</td>
            <td>${when(j.moved_to_dead_letter_at)}</td>
            ${CAN_WRITE ? `<td><button class="btn sm" data-replay="${esc(j.id)}">Replay</button></td>` : ''}
          </tr>`).join('')}
        </tbody></table></div>
      ${res.total_count > limit ? `<div class="pager">
        <span>${num(state.failedOffset + 1)} to ${num(Math.min(state.failedOffset + limit, res.total_count))} of ${num(res.total_count)}</span>
        <span style="display:flex;gap:8px">
          <button class="btn sm" id="prev" ${state.failedOffset === 0 ? 'disabled' : ''}>Previous</button>
          <button class="btn sm" id="next" ${state.failedOffset + limit < res.total_count ? '' : 'disabled'}>Next</button>
        </span></div>` : ''}
    </section>`;
  wireRows(el, res.jobs, openFailed);
  el.querySelectorAll('[data-replay]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); replay(b.dataset.replay, b); }));
  if ($('#prev')) $('#prev').addEventListener('click', () => { state.failedOffset = Math.max(0, state.failedOffset - limit); render(); });
  if ($('#next')) $('#next').addEventListener('click', () => { state.failedOffset += limit; render(); });
}

function mini(parts) {
  const total = parts.reduce((a, [, n]) => a + n, 0);
  if (!total) return '<div class="mini"></div>';
  return `<div class="mini">${parts.filter(([, n]) => n).map(([k, n]) => `<span style="flex-grow:${n / total};background:var(--${k})"></span>`).join('')}</div>`;
}

async function renderQueues(el) {
  const queues = await api('/api/queues');
  if (!queues.length) {
    el.innerHTML = `<section class="panel">${empty('No queues yet', '<p>A queue appears once a job is enqueued to it. Jobs go to <code class="mono">default</code> unless you pass <code class="mono">queue=</code>.</p>')}</section>`;
    return;
  }
  el.innerHTML = `<section class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Queue</th><th>Mix</th><th class="num">Queued</th><th class="num">Running</th><th class="num">Done</th><th class="num">Failed</th><th class="num">Cancelled</th><th class="num">Average run time</th></tr></thead>
    <tbody>${queues.map((q) => `
      <tr class="click" tabindex="0" data-queue="${esc(q.queue)}">
        <td><span class="name">${esc(q.queue)}</span></td>
        <td>${mini([['queued', q.queued], ['running', q.processing], ['done', q.done], ['failed', q.dead_letter], ['cancelled', q.cancelled]])}</td>
        <td class="num">${num(q.queued)}</td><td class="num">${num(q.processing)}</td><td class="num">${num(q.done)}</td>
        <td class="num"${q.dead_letter ? ' style="color:var(--failed);font-weight:600"' : ''}>${num(q.dead_letter)}</td>
        <td class="num">${num(q.cancelled)}</td><td class="num">${duration(q.avg_processing_time_ms)}</td>
      </tr>`).join('')}
    </tbody></table></div></section>`;
  el.querySelectorAll('tr[data-queue]').forEach((tr) => {
    const go = () => { state.jobs.queue = tr.dataset.queue; state.jobs.offset = 0; location.hash = '#/jobs'; };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  });
}

async function renderTypes(el) {
  const types = await api('/api/jobs/types');
  if (!types.length) {
    el.innerHTML = `<section class="panel">${empty('No job types yet', '<p>Each job name you enqueue gets a row here with its success rate and run time.</p>')}</section>`;
    return;
  }
  el.innerHTML = `<section class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Job name</th><th class="num">Runs</th><th class="num">Waiting</th><th class="num">Failed</th><th>Success</th><th class="num">Average run time</th><th>Last run</th></tr></thead>
    <tbody>${types.map((t) => {
      const rate = Number(t.success_rate) || 0;
      return `<tr class="click" tabindex="0" data-name="${esc(t.job_name)}">
        <td><span class="name">${esc(t.job_name)}</span></td>
        <td class="num">${num(t.total_count)}</td>
        <td class="num">${num(t.queued_count)}</td>
        <td class="num"${t.dead_letter_count ? ' style="color:var(--failed);font-weight:600"' : ''}>${num(t.dead_letter_count)}</td>
        <td><span style="display:inline-flex;align-items:center;gap:10px">${mini([['done', t.completed_count], ['failed', t.dead_letter_count]])}<span>${t.completed_count + t.dead_letter_count ? rate.toFixed(rate % 1 ? 1 : 0) + '%' : '-'}</span></span></td>
        <td class="num">${duration(t.avg_processing_time_ms)}</td>
        <td>${when(t.last_run)}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div></section>`;
  el.querySelectorAll('tr[data-name]').forEach((tr) => {
    const go = () => { state.jobs.q = tr.dataset.name; state.jobs.offset = 0; location.hash = '#/jobs'; };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  });
}

async function renderWorkers(el, chrome) {
  const workers = chrome.workers;
  if (!workers.length) {
    el.innerHTML = `<section class="panel">${empty('No workers have started', '<p>Start one with <code class="mono">soniq worker myapp.jobs:soniq</code>. It shows up here within a few seconds.</p>')}</section>`;
    return;
  }
  el.innerHTML = `<section class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Worker</th><th>State</th><th>Queues</th><th class="num">Slots</th><th>Last heartbeat</th><th>Started</th><th>Version</th></tr></thead>
    <tbody>${workers.map((w) => {
      const alive = isAlive(w);
      const st = alive ? ['done', 'Online'] : w.status === 'active' ? ['failed', 'Not responding'] : ['cancelled', w.status === 'stopping' ? 'Stopping' : 'Stopped'];
      const queues = Array.isArray(w.queues) && w.queues.length ? w.queues.map(esc).join(', ') : '<span class="muted">All queues</span>';
      return `<tr>
        <td><span class="name">${esc(w.hostname)}</span> <span class="muted mono">pid ${esc(w.pid)}</span></td>
        <td><span class="badge s-${st[0] === 'failed' ? 'failed' : st[0]}">${st[1]}</span></td>
        <td>${queues}</td>
        <td class="num">${num(w.concurrency)}</td>
        <td>${when(w.last_heartbeat)}</td>
        <td>${when(w.started_at)}</td>
        <td class="mono">${esc(w.version || '-')}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div></section>`;
}

async function renderPanel(el, id) {
  const res = await api('/api/panels/' + encodeURIComponent(id));
  if (res.error) {
    el.innerHTML = `<section class="panel">${empty('Panel not found', `<p>${esc(res.error)}.</p>`)}</section>`;
    return;
  }
  // Plugins return either an HTML fragment (trusted, like the plugin code itself) or JSON.
  const body = typeof res.content === 'string' ? res.content : `<pre class="code">${json(res.content)}</pre>`;
  el.innerHTML = `<section class="panel"><div class="plugin-panel">${body}</div></section>`;
}

// ---- Drawer ------------------------------------------------------------

let lastFocus = null;
function openDrawer(title, sub, body, actions) {
  lastFocus = document.activeElement;
  $('#drawer-title').textContent = title;
  $('#drawer-sub').innerHTML = sub;
  $('#drawer-body').innerHTML = body;
  $('#drawer-actions').innerHTML = actions || '';
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('open');
  $('#drawer-close').focus();
}
function closeDrawer() {
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('open');
  if (lastFocus) lastFocus.focus();
}
$('#drawer-close').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);

function props(rows) {
  return `<dl class="props">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

async function openJob(id) {
  let j;
  try { j = await api('/api/jobs/' + encodeURIComponent(id)); }
  catch (e) { return toast(e instanceof AuthError ? 'API key required' : 'This job no longer exists'); }
  const body = props([
    ['Status', badge(j.status)],
    ['Job id', `<span class="mono">${esc(j.id)}</span>`],
    ['Queue', esc(j.queue)],
    ['Priority', esc(j.priority)],
    ['Attempts', `${num(j.attempts)} of ${num(j.max_attempts)}`],
    ['Created', fullTime(j.created_at)],
    ['Updated', fullTime(j.updated_at)],
    ['Scheduled for', fullTime(j.scheduled_at)],
    ...(j.dedup_key ? [['Dedup key', `<span class="mono">${esc(j.dedup_key)}</span>`]] : []),
    ...(j.producer_id ? [['Enqueued by', esc(j.producer_id)]] : []),
  ]) + `<h3>Arguments</h3><pre class="code">${json(j.args || {})}</pre>`
    + (j.result != null ? `<h3>Result</h3><pre class="code">${json(j.result)}</pre>` : '')
    + (j.last_error ? `<h3>Last error</h3><pre class="code error">${esc(j.last_error)}</pre>` : '');
  let actions = '';
  if (CAN_WRITE) {
    if (j.status === 'queued') actions += `<button class="btn" data-act="cancel">Cancel job</button>`;
    if (j.status !== 'processing') actions += `<button class="btn danger" data-act="delete">Delete job</button>`;
  }
  openDrawer(j.job_name, `${badge(j.status)} <span class="muted">created ${esc(ago(j.created_at))}</span>`, body, actions);
  wireActions(j.id);
}

function openFailed(j) {
  const body = props([
    ['Why it failed', esc(REASONS[j.dead_letter_reason] || j.dead_letter_reason)],
    ['Job id', `<span class="mono">${esc(j.id)}</span>`],
    ['Queue', esc(j.queue)],
    ['Attempts', `${num(j.attempts)} of ${num(j.max_attempts)}`],
    ['Enqueued', fullTime(j.original_created_at)],
    ['Failed', fullTime(j.moved_to_dead_letter_at)],
    ['Replayed', `${num(j.resurrection_count)} time${j.resurrection_count === 1 ? '' : 's'}`],
  ]) + `<h3>Arguments</h3><pre class="code">${json(j.args || {})}</pre>`
    + (j.tags ? `<h3>Tags</h3><pre class="code">${json(j.tags)}</pre>` : '')
    + (j.last_error ? `<h3>Last error</h3><pre class="code error">${esc(j.last_error)}</pre>` : '');
  const actions = CAN_WRITE ? `<button class="btn primary" data-act="replay">Replay job</button>` : '';
  openDrawer(j.job_name, `${badge('failed')} <span class="muted">failed ${esc(ago(j.moved_to_dead_letter_at))}</span>`, body, actions);
  const b = $('#drawer-actions [data-act="replay"]');
  if (b) b.addEventListener('click', () => replay(j.id, b, true));
}

function wireActions(id) {
  $('#drawer-actions').querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
    const act = b.dataset.act;
    // Delete is permanent, so it takes a second click instead of a browser dialog.
    if (act === 'delete' && !b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = 'Click again to delete';
      setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Delete job'; }, 4000);
      return;
    }
    b.disabled = true;
    try {
      if (act === 'cancel') await api(`/api/jobs/${encodeURIComponent(id)}/cancel`, { method: 'POST' });
      else await api(`/api/jobs/${encodeURIComponent(id)}`, { method: 'DELETE' });
      toast(act === 'cancel' ? 'Job cancelled' : 'Job deleted');
      closeDrawer();
      render();
    } catch (e) {
      b.disabled = false;
      toast(e.message);
    }
  }));
}

async function replay(id, button, fromDrawer) {
  button.disabled = true;
  try {
    await api(`/api/dead-letter/${encodeURIComponent(id)}/replay`, { method: 'POST' });
    toast('Job replayed. It is back in its queue.');
    if (fromDrawer) closeDrawer();
    render();
  } catch (e) {
    button.disabled = false;
    toast(e.message);
  }
}

// ---- API key gate ------------------------------------------------------

function showKeyGate() {
  stopTimer();
  $('#title').textContent = 'Sign in';
  $('#view').innerHTML = `
    <div class="keygate">
      <h2>Enter the dashboard API key</h2>
      <p>This dashboard has <code class="mono">SONIQ_DASHBOARD_API_KEY</code> set. Paste the key to continue. It stays in this browser tab only.</p>
      <form id="key-form">
        <input id="key-input" type="password" autocomplete="off" aria-label="API key" required>
        <button class="btn primary" type="submit">Continue</button>
      </form>
    </div>`;
  if (store('session', KEY_STORE)) toast('That key was not accepted');
  $('#key-input').focus();
  $('#key-form').addEventListener('submit', (e) => {
    e.preventDefault();
    store('session', KEY_STORE, $('#key-input').value.trim());
    boot();
  });
}

// ---- Live updates ------------------------------------------------------

function startTimer() {
  stopTimer();
  if (state.live && !document.hidden) state.timer = setInterval(() => { if (!$('#drawer').classList.contains('open')) render(); }, REFRESH_MS);
}
function stopTimer() { clearInterval(state.timer); state.timer = null; }

$('#live').addEventListener('click', () => {
  state.live = !state.live;
  $('#live').setAttribute('aria-pressed', String(state.live));
  $('#live .dot').classList.toggle('on', state.live);
  $('#live-text').textContent = state.live ? 'Live' : 'Paused';
  if (state.live) { render(); startTimer(); } else stopTimer();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopTimer(); else if (state.live) { render(); startTimer(); } });

$('#global-search').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  state.jobs = { offset: 0, status: '', queue: '', q: e.target.value.trim() };
  if (location.hash.startsWith('#/jobs')) render(); else location.hash = '#/jobs';
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#drawer').classList.contains('open')) closeDrawer();
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#global-search').focus(); }
});
window.addEventListener('hashchange', () => render());

async function boot() {
  await loadPanels();
  await render({ first: true });
  startTimer();
}
boot();
</script>
</body>
