# Soniq on Docker Compose: PostgreSQL, a one-shot schema setup, a worker,
# the scheduler and the dashboard.
#
# Put your job code in ./app (it is mounted as the `myapp` package) and set
# POSTGRES_PASSWORD and SONIQ_DASHBOARD_API_KEY in a .env file next to this one.

x-soniq-env: &soniq-env
  SONIQ_DATABASE_URL: postgresql://soniq:${POSTGRES_PASSWORD:-change_me}@postgres:5432/soniq_prod
  SONIQ_LOG_LEVEL: INFO
  SONIQ_JOBS_MODULES: myapp.jobs

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: soniq_prod
      POSTGRES_USER: soniq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soniq -d soniq_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies Soniq's migrations, then exits. Workers start after it succeeds.
  soniq_setup:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
    environment: *soniq-env
    volumes:
      - ./app:/app/myapp
    command: ["soniq", "setup"]
    restart: "no"

  soniq_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    depends_on:
      soniq_setup:
        condition: service_completed_successfully
    environment:
      <<: *soniq-env
      # The soniq_scheduler service runs @periodic jobs, so silence the
      # worker's "no scheduler" warning.
      SONIQ_SCHEDULER_SUPPRESS_WARNING: "1"
    volumes:
      - ./app:/app/myapp
    command: ["soniq", "worker", "--concurrency=4"]
    # SIGTERM starts a drain of up to SONIQ_SHUTDOWN_TIMEOUT (30s). Give it
    # longer than that before Docker sends SIGKILL.
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Needed only if you use @periodic jobs. Extra copies are safe: they
  # elect one leader through a PostgreSQL advisory lock.
  soniq_scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    depends_on:
      soniq_setup:
        condition: service_completed_successfully
    environment: *soniq-env
    volumes:
      - ./app:/app/myapp
    command: ["soniq", "scheduler"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Optional web UI. Read-only unless SONIQ_DASHBOARD_WRITE_ENABLED=true.
  soniq_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: always
    depends_on:
      soniq_setup:
        condition: service_completed_successfully
    environment:
      <<: *soniq-env
      # Required when the dashboard listens on 0.0.0.0. Without a key it
      # accepts only localhost Host headers. Send it as X-API-Key.
      SONIQ_DASHBOARD_API_KEY: ${SONIQ_DASHBOARD_API_KEY:?set SONIQ_DASHBOARD_API_KEY}
    ports:
      - "127.0.0.1:6161:6161"
    command: ["soniq", "dashboard", "--host=0.0.0.0", "--port=6161"]
    healthcheck:
      # The HTML page at / does not need the API key.
      test: ["CMD", "curl", "-fsS", "http://localhost:6161/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: a worker for the urgent queue only.
  # Start it with: docker compose --profile priority up
  soniq_priority_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    depends_on:
      soniq_setup:
        condition: service_completed_successfully
    environment:
      <<: *soniq-env
      SONIQ_SCHEDULER_SUPPRESS_WARNING: "1"
    volumes:
      - ./app:/app/myapp
    command: ["soniq", "worker", "--concurrency=2", "--queues=urgent"]
    stop_grace_period: 45s
    profiles:
      - priority

volumes:
  postgres_data:
