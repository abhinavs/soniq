# Soniq Supervisor Configuration
# Place this file in /etc/supervisor/conf.d/soniq.conf
# Run `soniq setup` once per deploy before you start these programs.
# Replace the database URL. SONIQ_JOBS_MODULES names your job modules.

[group:soniq]
programs=soniq_worker,soniq_scheduler,soniq_dashboard

[program:soniq_worker]
command=/opt/soniq/venv/bin/soniq worker --concurrency=4
directory=/opt/soniq
user=soniq
autostart=true
autorestart=true
startretries=3
# SIGTERM starts a drain of up to SONIQ_SHUTDOWN_TIMEOUT (30s). Supervisor's
# default of 10s would kill jobs mid-run.
stopsignal=TERM
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=/var/log/soniq/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
# soniq_scheduler runs @periodic jobs, so silence the worker's
# "no scheduler" warning.
environment=SONIQ_DATABASE_URL="postgresql://soniq:password@localhost/soniq_prod",SONIQ_LOG_LEVEL="INFO",SONIQ_JOBS_MODULES="myapp.jobs",SONIQ_SCHEDULER_SUPPRESS_WARNING="1"

# Needed only if you use @periodic jobs.
[program:soniq_scheduler]
command=/opt/soniq/venv/bin/soniq scheduler
directory=/opt/soniq
user=soniq
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/soniq/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=SONIQ_DATABASE_URL="postgresql://soniq:password@localhost/soniq_prod",SONIQ_LOG_LEVEL="INFO",SONIQ_JOBS_MODULES="myapp.jobs"

# Optional web UI. Needs: pip install "soniq[dashboard]"
# Binds to localhost. To listen on 0.0.0.0, also set SONIQ_DASHBOARD_API_KEY.
[program:soniq_dashboard]
command=/opt/soniq/venv/bin/soniq dashboard --host=127.0.0.1 --port=6161
directory=/opt/soniq
user=soniq
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/soniq/dashboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=SONIQ_DATABASE_URL="postgresql://soniq:password@localhost/soniq_prod",SONIQ_LOG_LEVEL="INFO"

# Optional: a worker for the urgent queue only. Add it to the group above
# if you use it.
[program:soniq_priority_worker]
command=/opt/soniq/venv/bin/soniq worker --concurrency=2 --queues=urgent
directory=/opt/soniq
user=soniq
autostart=false
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=45
redirect_stderr=true
stdout_logfile=/var/log/soniq/priority_worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=SONIQ_DATABASE_URL="postgresql://soniq:password@localhost/soniq_prod",SONIQ_LOG_LEVEL="INFO",SONIQ_JOBS_MODULES="myapp.jobs",SONIQ_SCHEDULER_SUPPRESS_WARNING="1"
