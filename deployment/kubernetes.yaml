# Soniq on Kubernetes: a setup Job, workers, the scheduler and the dashboard.
#
# Build one image from Dockerfile.worker (with your job code) and one from
# Dockerfile.dashboard, push them, and replace registry.example.com/... below.
# Run the soniq-setup Job once per deploy, before you roll out the workers.

apiVersion: v1
kind: Namespace
metadata:
  name: soniq

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soniq-config
  namespace: soniq
data:
  SONIQ_LOG_LEVEL: "INFO"
  SONIQ_JOBS_MODULES: "myapp.jobs"

---
apiVersion: v1
kind: Secret
metadata:
  name: soniq-secrets
  namespace: soniq
type: Opaque
stringData:
  # Replace both values. Better still, create this Secret outside version control.
  SONIQ_DATABASE_URL: "postgresql://soniq:change_me@postgres.example.internal:5432/soniq_prod"
  # The dashboard needs this when it listens on 0.0.0.0. Send it as X-API-Key.
  SONIQ_DASHBOARD_API_KEY: "change_me_to_a_long_random_string"

---
# Applies Soniq's migrations, then exits. Delete and re-apply it on each
# deploy, or run `soniq setup` from your CI pipeline instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: soniq-setup
  namespace: soniq
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: soniq-setup
        image: registry.example.com/myapp-worker:1.0.0
        args: ["soniq", "setup"]
        env:
        - name: SONIQ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soniq-secrets
              key: SONIQ_DATABASE_URL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soniq-worker
  namespace: soniq
  labels:
    app: soniq-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: soniq-worker
  template:
    metadata:
      labels:
        app: soniq-worker
    spec:
      # SIGTERM starts a drain of up to SONIQ_SHUTDOWN_TIMEOUT (30s). Give it
      # longer than that before Kubernetes sends SIGKILL.
      terminationGracePeriodSeconds: 45
      containers:
      - name: soniq-worker
        image: registry.example.com/myapp-worker:1.0.0
        args:
          - "soniq"
          - "worker"
          - "--concurrency=4"
        env:
        - name: SONIQ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soniq-secrets
              key: SONIQ_DATABASE_URL
        # The soniq-scheduler Deployment below runs @periodic jobs, so
        # silence the worker's "no scheduler" warning.
        - name: SONIQ_SCHEDULER_SUPPRESS_WARNING
          value: "1"
        envFrom:
        - configMapRef:
            name: soniq-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always

---
# Soniq Scheduler. Needed only for @periodic jobs. One replica is enough.
# Extra replicas are safe: they elect one leader through the
# `soniq.scheduler` PostgreSQL advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soniq-scheduler
  namespace: soniq
  labels:
    app: soniq-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soniq-scheduler
  template:
    metadata:
      labels:
        app: soniq-scheduler
    spec:
      containers:
      - name: soniq-scheduler
        image: registry.example.com/myapp-worker:1.0.0
        args:
          - "soniq"
          - "scheduler"
        env:
        - name: SONIQ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soniq-secrets
              key: SONIQ_DATABASE_URL
        envFrom:
        - configMapRef:
            name: soniq-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soniq-dashboard
  namespace: soniq
  labels:
    app: soniq-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soniq-dashboard
  template:
    metadata:
      labels:
        app: soniq-dashboard
    spec:
      containers:
      - name: soniq-dashboard
        image: registry.example.com/myapp-dashboard:1.0.0
        args:
          - "soniq"
          - "dashboard"
          - "--host=0.0.0.0"
          - "--port=6161"
        env:
        - name: SONIQ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soniq-secrets
              key: SONIQ_DATABASE_URL
        # With a key set, the dashboard accepts any Host header (pod IPs,
        # the ingress host) and requires X-API-Key on every path except /.
        - name: SONIQ_DASHBOARD_API_KEY
          valueFrom:
            secretKeyRef:
              name: soniq-secrets
              key: SONIQ_DASHBOARD_API_KEY
        envFrom:
        - configMapRef:
            name: soniq-config
        ports:
        - containerPort: 6161
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          # The HTML page at / answers without the API key.
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: soniq-dashboard-service
  namespace: soniq
  labels:
    app: soniq-dashboard
spec:
  selector:
    app: soniq-dashboard
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soniq-dashboard-ingress
  namespace: soniq
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - soniq.yourdomain.com
    secretName: soniq-tls
  rules:
  - host: soniq.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: soniq-dashboard-service
            port:
              number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soniq-priority-worker
  namespace: soniq
  labels:
    app: soniq-priority-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soniq-priority-worker
  template:
    metadata:
      labels:
        app: soniq-priority-worker
    spec:
      terminationGracePeriodSeconds: 45
      containers:
      - name: soniq-priority-worker
        image: registry.example.com/myapp-worker:1.0.0
        args:
          - "soniq"
          - "worker"
          - "--concurrency=2"
          - "--queues=urgent"
        env:
        - name: SONIQ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soniq-secrets
              key: SONIQ_DATABASE_URL
        envFrom:
        - configMapRef:
            name: soniq-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      restartPolicy: Always

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soniq-worker-hpa
  namespace: soniq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soniq-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

# Prometheus: the dashboard has no /metrics endpoint. To export metrics,
# pass Soniq(metrics_sink=PrometheusMetricsSink()) from soniq.observability,
# call prometheus_client.start_http_server(9090) in the worker process, and
# scrape port 9090 on the worker pods.
